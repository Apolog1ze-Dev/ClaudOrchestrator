[package]
name = "claudorchestrator"
version = "0.0.2"
description = "AI-powered development orchestrator - Traycer AI competitor"
authors = ["ClaudOrchestrator"]
edition = "2021"

[lib]
name = "claudorchestrator_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
handlebars = "6"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tempfile = "3"
tauri-plugin-updater = "2"
